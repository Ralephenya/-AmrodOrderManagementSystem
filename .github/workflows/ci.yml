name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  CI: "true"

jobs:
  api:
    name: API · build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          # The services target net8.0, so the tests need the 8.0 runtime next to the SDK global.json pins.
          dotnet-version: 8.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore OrderManagement.slnx
      # Warnings are errors (Directory.Build.props), so this also enforces the analyzers and code style.
      - run: dotnet build OrderManagement.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/OrderManagement.UnitTests -c Release --no-build --logger "trx;LogFileName=unit.trx"
      - name: Integration tests (SQL Server via Testcontainers)
        run: dotnet test tests/OrderManagement.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx"
        env:
          ORDERS_TEST_SQL: container
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/**/TestResults/*.trx

  migrations:
    name: Database · migration scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci_only_P4ssw0rd!
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci_only_P4ssw0rd! -Q 'SELECT 1' -b"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      SQLCMD: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci_only_P4ssw0rd! -b -I
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - run: dotnet tool restore
      - name: Scripts are up to date with the migrations
        run: |
          EF="dotnet ef --project src/OrderManagement.Infrastructure --startup-project src/OrderManagement.Infrastructure"
          $EF migrations script --idempotent -o db/scripts/migrate-idempotent.sql
          git diff --exit-code --ignore-cr-at-eol db/scripts/ \
            || { echo "::error::db/scripts is stale. Regenerate it (see db/README.md) and commit."; exit 1; }
      - name: sqlcmd is available
        run: |
          if ! [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
            curl -fsSL https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update && sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          fi
      # The same checks done by hand when each migration was added: forward, re-run (idempotent), roll back one
      # step, forward again.
      - name: Apply to an empty database
        run: |
          $SQLCMD -Q "CREATE DATABASE OrderManagement"
          $SQLCMD -d OrderManagement -i db/scripts/migrate-idempotent.sql
      - name: Re-apply (idempotent)
        run: $SQLCMD -d OrderManagement -i db/scripts/migrate-idempotent.sql
      - name: Roll back the latest migration, then forward again
        run: |
          for f in db/scripts/rollback-*.sql; do $SQLCMD -d OrderManagement -i "$f"; done
          $SQLCMD -d OrderManagement -i db/scripts/migrate-idempotent.sql
          $SQLCMD -d OrderManagement -h -1 -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM __EFMigrationsHistory"

  web:
    name: Web · lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Generated API types match the checked-in OpenAPI document
        run: |
          npm run api:types
          git diff --exit-code --ignore-cr-at-eol src/api/schema.d.ts \
            || { echo "::error::src/api/schema.d.ts is stale. Run npm run api:types and commit."; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end · Playwright against docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose -f deploy/docker-compose.yml up --build --detach --wait --wait-timeout 300
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Playwright (journeys + accessibility)
        run: npx playwright test
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8080
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
      - name: Container logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --volumes

  images:
    name: Images · build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api, migrations, web, e2e]
    # Pull requests only build the images (in e2e); pushes to the main branch publish them.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, migrations, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR names must be lower case; the repository name is lower-cased here.
          images: ghcr.io/${{ github.repository_owner }}/order-management-${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
